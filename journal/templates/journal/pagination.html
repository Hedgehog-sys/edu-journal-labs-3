{% if page_obj.has_other_pages %}
    <nav aria-label="Переход между страницами">
        <ul class="pagination justify-content-center">
            {% if page_obj.has_previous %}
                <li class="page-item">
                    <a class="page-link" href="?{{ request.GET.urlencode }}&page={{ page_obj.previous_page_number }}">Назад</a>
                </li>
            {% endif %}

            <li class="page-item disabled">
                <span class="page-link">
                    {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
                </span>
            </li>

            {% if page_obj.has_next %}
                <li class="page-item">
                    <a class="page-link" href="?{{ request.GET.urlencode }}&page={{ page_obj.next_page_number }}">Вперёд</a>
                </li>
            {% endif %}
        </ul>
    </nav>
{% endif %}
